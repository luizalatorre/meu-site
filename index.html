---
layout: default
title: Trabalhos
---

<section class="filters">
  <button class="filter-btn active" data-filter="todos">Todos</button>
  {% assign categorias = site.projects | map: "categoria" | uniq %}
  {% for cat in categorias %}
    <button class="filter-btn" data-filter="{{ cat }}">{{ cat | capitalize }}</button>
  {% endfor %}
</section>

<section class="grid" id="grid">
  {% assign projetos = site.projects | sort: "ano" | reverse %}
  {% for projeto in projetos %}
    <a href="{{ projeto.url | relative_url }}"
       class="grid-item"
       data-categoria="{{ projeto.categoria }}">
      <img src="{{ projeto.capa | relative_url }}" alt="{{ projeto.title }}">
      <p>{{ projeto.title }} <span class="year">({{ projeto.ano }})</span></p>
    </a>
  {% endfor %}
</section>
